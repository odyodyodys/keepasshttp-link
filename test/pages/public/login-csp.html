<!doctype html>
<html>
<head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>Test login with a strict CSP</title><script src="/instrument.js"></script></head>
<body>
  <h1>Test login (dummy), strict Content-Security-Policy (no inline styles)</h1>
  <form id="f" action="/submitted" method="post">
    <input type="text" name="username" id="username" autocomplete="username">
    <input type="password" name="password" id="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <input type="text" id="other" name="other" placeholder="unrelated field">
</body>
</html>
