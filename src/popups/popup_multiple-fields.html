<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>KeePassHttp-Link</title>
		<link rel="stylesheet" href="../ui.css">
		<script src="popup_functions.js" defer></script>
	</head>
	<body class="popup">
		<div id="settings" class="settings">
			<button id="btn-options" type="button" class="small">Settings</button>
			<button id="btn-choose-credential-fields" type="button" class="small">Choose own credential fields for this page</button>
		</div>

		<p>
			KeePassHttp-Link found more than one password field on this page. To enter your
			logins, right-click on one of the password fields, and choose either the
			"<code>Fill User + Pass</code>" or "<code>Fill Pass Only</code>" command.
		</p>
	</body>
</html>
