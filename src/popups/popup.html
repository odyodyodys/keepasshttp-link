<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>KeePassHttp-Link</title>
		<link rel="stylesheet" href="../ui.css">
		<link rel="stylesheet" href="../tokens.css">
		<link rel="stylesheet" href="popup.css">
		<script src="../ui-icons.js" defer></script>
		<script src="popup.js" defer></script>
	</head>
	<!-- Toolbar popup on pages without logins to choose (pages with logins
	     open popup_login.html). One state at a time, as on the settings page:
	     A, A2, B, B-wait, B2, B3, C. Filled by popup.js. -->
	<body class="popup-status">
		<header class="p-head">
			<div class="p-brand">
				<img src="/icons/icon.svg" width="20" height="20" alt="">
				<span>KeePassHttp-Link</span>
			</div>
			<button type="button" class="p-icon-btn" id="p-settings" aria-label="Settings" title="Settings"></button>
		</header>

		<div class="p-body" id="p-body" aria-live="polite" hidden>
			<div class="p-sentence">
				<span class="p-state-icon" id="p-state-icon"></span>
				<div class="p-sentence-text">
					<div class="p-headline" id="p-headline"></div>
					<div class="p-sub" id="p-sub" hidden></div>
				</div>
			</div>

			<!-- First run: the three steps (A and B). -->
			<div class="p-box p-steps" id="p-steps" hidden>
				<div class="p-box-title">To get started</div>
				<div class="p-step" data-row="1"><span class="p-tick"></span><div class="p-step-text"></div></div>
				<div class="p-step" data-row="2"><span class="p-tick"></span><div class="p-step-text">Start KeePass and open your database.</div></div>
				<div class="p-step" data-row="3"><span class="p-tick"></span><div class="p-step-text"></div></div>
				<button type="button" class="p-primary p-wide" id="p-steps-action" hidden>Give Firefox access</button>
				<div class="p-hint" id="p-steps-hint" hidden>KeePass will ask for a Key Name. Type the database's name, for example Work.</div>
			</div>

			<!-- Connected: the current site. -->
			<div class="p-box p-site" id="p-site" hidden>
				<div class="p-site-row">
					<div class="p-site-name" id="p-site-name"></div>
					<div class="p-site-count" id="p-site-count"></div>
				</div>
				<div class="p-site-actions">
					<button type="button" class="p-secondary" id="p-redetect">Redetect fields</button>
					<button type="button" class="p-secondary" id="p-choose">Choose fields</button>
				</div>
			</div>

			<!-- Connected, but KeePass has no login for this site. -->
			<div class="p-box p-none" id="p-none" hidden>
				<div class="p-none-title" id="p-none-title"></div>
				<div class="p-sub" id="p-none-save"></div>
				<div class="p-sub" id="p-none-url"></div>
				<!-- Only when no sign-in form was found (KeePass not asked). -->
				<div class="p-site-actions" id="p-none-actions" hidden>
					<button type="button" class="p-secondary" id="p-none-redetect">Redetect fields</button>
					<button type="button" class="p-secondary" id="p-none-choose">Choose fields</button>
				</div>
			</div>

			<button type="button" class="p-primary p-wide" id="p-action" hidden></button>
			<button type="button" class="p-secondary p-cancel" id="p-cancel" hidden>Cancel</button>
		</div>
	</body>
</html>
