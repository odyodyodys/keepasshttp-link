<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>KeePassHttp-Neo</title>
		<link rel="stylesheet" href="../ui.css">
		<script src="popup_functions.js" defer></script>
		<script src="popup_remember.js" defer></script>
	</head>
	<body class="popup">
		<div class="buttons">
			<p>
				Username or password changed! Save it?
				<br>
				<span class="meta information-url">URL: <span></span></span>
				<br>
				<span class="meta information-username">Username: <span></span></span>
			</p>
			<p class="actions">
				<button id="btn-new" type="button" class="success">New</button>
				<button id="btn-update" type="button" class="primary">Update</button>
				<button id="btn-dismiss" type="button" class="danger">Dismiss</button>
			</p>
		</div>

		<div class="connected-database meta" hidden>
			<p>Credentials will be saved in the connected database with identifier <em></em>.</p>
		</div>

		<div class="credentials" hidden>
			<hr>
			<p class="username-new" hidden>The used username <strong></strong> is currently not saved!</p>
			<p class="username-exists" hidden>The credentials with the used username <strong></strong> are marked bold.</p>
			<p>Please choose the credentials you want to update:</p>
			<ul id="list" class="logins"></ul>
		</div>
	</body>
</html>
