<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>KeePassHttp-Neo</title>
		<link rel="stylesheet" href="../ui.css">
		<script src="../browser-polyfill.min.js" defer></script>
		<script src="popup_functions.js" defer></script>
		<script src="popup_login.js" defer></script>
	</head>
	<body class="popup">
		<div id="settings" class="settings">
			<button id="btn-options" type="button" class="small">Settings</button>
			<button id="btn-choose-credential-fields" type="button" class="small">Choose own credential fields for this page</button>
		</div>

		<div class="credentials">
			<p>Select the login you want to fill into the page:</p>
			<ul id="login-list" class="logins"></ul>
		</div>
	</body>
</html>
