<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>KeePassHttp-Link</title>
		<link rel="stylesheet" href="../ui.css">
		<script src="popup_functions.js" defer></script>
		<script src="popup_httpauth.js" defer></script>
	</head>
	<body class="popup">
		<div id="settings" class="settings">
			<button id="btn-options" type="button" class="small">Settings</button>
			<button id="btn-choose-credential-fields" type="button" class="small">Choose own credential fields for this page</button>
		</div>

		<div class="credentials">
			<p id="insecure-warning" class="alert" hidden>
				<strong>Warning:</strong> this connection is not encrypted (not https). The password can be read by others on the network.
			</p>
			<p>Select the login you want to log in with:</p>
			<ul id="login-list" class="logins"></ul>
		</div>
	</body>
</html>
